services:
  - type: web
    name: homepage
    runtime: static
    buildCommand: node build.js
    staticPublishPath: public
    envVars:
      - key: GAME_API_ORIGIN
        value: https://square-game-ab8t.onrender.com
    domains:
      - nathanielmann.ca
    routes:
      # The investment tool used to live on this domain; keep old links working.
      - type: redirect
        source: /app
        destination: https://app.nathanielmann.ca/app
      - type: redirect
        source: /research.html
        destination: https://app.nathanielmann.ca/app
      - type: redirect
        source: /login
        destination: https://app.nathanielmann.ca/login
      - type: redirect
        source: /squaregame
        destination: /square-game
      - type: redirect
        source: /squaregame/*
        destination: /square-game/*
      - type: redirect
        source: /square_game
        destination: /square-game
      - type: redirect
        source: /square_game/*
        destination: /square-game/*
      - type: redirect
        source: /sqaure-game
        destination: /square-game
      - type: redirect
        source: /sqaure-game/*
        destination: /square-game/*
      - type: redirect
        source: /Square-Game
        destination: /square-game
      - type: redirect
        source: /Square-Game/*
        destination: /square-game/*
      - type: rewrite
        source: /square-game
        destination: /square-game.html
      - type: rewrite
        source: /square-game/room/*
        destination: /square-game.html
      - type: redirect
        source: /portfolio
        destination: /projects
      - type: rewrite
        source: /about
        destination: /index.html
      - type: rewrite
        source: /projects
        destination: /index.html
