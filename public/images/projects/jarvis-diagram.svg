<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 1360 960" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c9a54e"/>
    </marker>
  </defs>
  <rect width="1360" height="960" fill="#004225"/>
  <text x="80" y="110" fill="#e4c983" font-size="26" font-weight="800" letter-spacing="5">HOW JARVIS WORKS</text>

  <g stroke="#c9a54e" stroke-width="5" fill="none" marker-end="url(#head)">
    <path d="M440 250H492"/>
    <path d="M680 340V422"/>
    <path d="M1120 348V422" marker-start="url(#head)"/>
    <path d="M260 610V692"/>
    <path d="M440 790H492"/>
  </g>

  <g fill="#f5f3ec">
    <rect x="80" y="160" width="360" height="180" rx="10"/>
    <rect x="500" y="160" width="360" height="180" rx="10"/>
    <rect x="960" y="160" width="320" height="180" rx="10"/>
    <rect x="80" y="700" width="360" height="180" rx="10"/>
    <rect x="500" y="700" width="360" height="180" rx="10"/>
  </g>
  <rect x="80" y="430" width="1200" height="180" rx="10" fill="#c9a54e"/>

  <g text-anchor="middle" fill="#13261b">
    <text x="260" y="232" font-size="42" font-weight="700">“Hey Jarvis”</text>
    <text x="260" y="282" font-size="32" fill="#5f7066">Microphone,</text>
    <text x="260" y="322" font-size="32" fill="#5f7066">openWakeWord</text>

    <text x="680" y="232" font-size="42" font-weight="700">Speech to text</text>
    <text x="680" y="282" font-size="32" fill="#5f7066">Whisper,</text>
    <text x="680" y="322" font-size="32" fill="#5f7066">on the GPU</text>

    <text x="1120" y="232" font-size="42" font-weight="700">Discord</text>
    <text x="1120" y="282" font-size="32" fill="#5f7066">A second</text>
    <text x="1120" y="322" font-size="32" fill="#5f7066">way in</text>

    <text x="680" y="510" font-size="58" font-weight="700" fill="#002b18">Claude + tools</text>
    <text x="680" y="566" font-size="36" fill="#002b18">Calendar · Email · OnQ · Trello · Notes</text>

    <text x="260" y="772" font-size="42" font-weight="700">Text to speech</text>
    <text x="260" y="822" font-size="32" fill="#5f7066">Piper,</text>
    <text x="260" y="862" font-size="32" fill="#5f7066">British voice</text>

    <text x="680" y="772" font-size="42" font-weight="700">Speaker</text>
    <text x="680" y="822" font-size="32" fill="#5f7066">About 3 s after</text>
    <text x="680" y="862" font-size="32" fill="#5f7066">I stop talking</text>
  </g>

  <g fill="#e4c983" font-size="30">
    <text x="950" y="772">Audio never leaves</text>
    <text x="950" y="812">the laptop. Only</text>
    <text x="950" y="852">text goes to Claude.</text>
  </g>
</svg>
